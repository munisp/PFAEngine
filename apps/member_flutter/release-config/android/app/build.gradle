// Release-ready app module build file for the PFAEngine member app.
// Copied over the generated android/app/build.gradle by
// scripts/flutter-release-scaffold.sh. Groovy DSL works with both Groovy and
// Kotlin-DSL settings files generated by current Flutter templates.
plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle plugin (loaded via the declarative plugins block in
    // android/settings.gradle generated by `flutter create`).
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing config is read from android/key.properties (gitignored). Generate it
// from key.properties.template; CI writes it from secrets instead.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.pfaengine.member"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Placeholder application id — must match the Play listing. Immutable
        // after first upload.
        applicationId "com.pfaengine.member"
        // camera plugin (selfie liveness) requires minSdk >= 21.
        minSdk Math.max(flutter.minSdkVersion, 21)
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            // Fall back to debug signing when key.properties is absent (local
            // dev/CI sanity builds). NEVER upload a debug-signed artifact.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}
