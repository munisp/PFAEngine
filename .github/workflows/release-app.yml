name: release-app

# Builds the store artifacts for the member apps on version tags.
#   - member-pwa: production web build (also the artifact a TWA wraps)
#   - twa: Google Play AAB/APK via Bubblewrap (gated on a configured prod host)
#   - flutter-android: signed APK + AAB from the Flutter app
#
# Secrets required for signed artifacts (Actions → Secrets):
#   KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD  keystore storePassword
#   KEY_ALIAS          key alias (e.g. pfaengine-upload)
#   KEY_PASSWORD       key password
# Without the secrets, jobs build unsigned/debug-signed artifacts so the
# pipeline stays green; those artifacts must never be uploaded to a store.
#
# Runbook: docs/APP-STORE-RELEASE.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    name: member-pwa web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/member-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed for this app yet; use npm install.
      # Commit a lockfile and switch to `npm ci` before real releases.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: member-pwa-dist
          path: apps/member-pwa/dist
          retention-days: 30

  twa:
    name: TWA (Bubblewrap) Play artifact
    runs-on: ubuntu-latest
    # The TWA build regenerates its Android project from twa-manifest.json and
    # downloads icons from the LIVE origin, so it only works once the PWA is
    # deployed at the production host. Until then this job is skipped; run
    # `bubblewrap update && bubblewrap build` locally (apps/member-pwa/twa/README.md).
    # Enable by setting repo variable TWA_HOST_CONFIGURED=true.
    if: vars.TWA_HOST_CONFIGURED == 'true'
    defaults:
      run:
        working-directory: apps/member-pwa/twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::KEYSTORE_BASE64 not set — building unsigned artifacts"
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > android-upload-key.keystore
          fi

      - name: Regenerate Android project from twa-manifest.json
        run: bubblewrap update

      - name: Build signed AAB + APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f android-upload-key.keystore ]; then
            bubblewrap build --skipPwaValidation \
              --signingKeyPath=./android-upload-key.keystore \
              --signingKeyAlias="${{ secrets.KEY_ALIAS || 'pfaengine-upload' }}"
          else
            bubblewrap build --skipPwaValidation --skipSigning
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: twa-play-artifacts
          path: |
            apps/member-pwa/twa/app-release-bundle.aab
            apps/member-pwa/twa/app-release-signed.apk
          retention-days: 30

  flutter-android:
    name: Flutter APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/member_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold android/ + apply release config
        run: bash ../../scripts/flutter-release-scaffold.sh

      - name: Configure signing from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No keystore secrets — release build will fall back to debug signing (see build.gradle)"
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/upload-keystore.jks
          EOF
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB (Play upload)
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE=https://api.pfaengine.example

      - name: Build APK (sideload/QA)
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE=https://api.pfaengine.example

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android-release
          path: |
            apps/member_flutter/build/app/outputs/bundle/release/app-release.aab
            apps/member_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/member_flutter/build/symbols/**
          retention-days: 30

      # --- Optional: auto-upload AAB to Play internal track -----------------
      # Requires: service account JSON key with Play Console "Release apps to
      # internal track" permission, stored as PLAY_SERVICE_ACCOUNT_JSON, and
      # fastlane installed (gem install fastlane). See docs/APP-STORE-RELEASE.md.
      # - name: Upload to Play internal track
      #   env:
      #     PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #   run: |
      #     echo "${PLAY_SERVICE_ACCOUNT_JSON}" > play-service-account.json
      #     fastlane supply --aab build/app/outputs/bundle/release/app-release.aab \
      #       --package_name com.pfaengine.member --track internal \
      #       --json_key play-service-account.json
