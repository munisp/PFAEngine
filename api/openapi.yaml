openapi: 3.0.3
info:
  title: PFAEngine — PFA-as-a-Service API
  version: 1.0.0
  description: |
    Multi-tenant pension fund administration API (Architecture Report §6).
    REST/JSON over the gateway; OAuth2 client-credentials for partners,
    OIDC for users; all endpoints tenant-scoped via X-Tenant-ID (dev) or
    tenant subdomain claim (production). Webhooks for async outcomes.
servers:
  - url: http://localhost:8080
paths:
  /v1/members:
    post:
      summary: Create member profile; returns person_id; triggers KYC workflow
      tags: [Onboarding & KYC]
      responses: { '201': { description: Created } }
  /v1/kyc/nin/verify:
    post:
      summary: NIN verification via NIMC-licensed aggregator (tokenized)
      tags: [Onboarding & KYC]
      responses: { '200': { description: Verified } }
  /v1/kyc/bvn/verify:
    post:
      summary: BVN validation via NIBSS (name/DOB/phone match; hash-only persistence)
      tags: [Onboarding & KYC]
      responses: { '200': { description: Validated } }
  /v1/kyc/liveness:
    post:
      summary: Submit selfie-liveness + face-match job (ENROLL or IAM_ALIVE)
      tags: [Onboarding & KYC]
      responses: { '200': { description: Result with status/score } }
  /v1/kyc/liveness/{id}:
    get:
      summary: Poll verification status/score
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Status } }
  /v1/members/{id}/rsa:
    post:
      summary: Open RSA; picks fund; requests PenCom PIN; emits rsa.opened
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '201': { description: RSA opened } }
  /v1/consents:
    post:
      summary: NDPA consent capture per purpose with wording version
      tags: [Onboarding & KYC]
      responses: { '201': { description: Recorded } }
    get:
      summary: Retrieve consents per data subject
      tags: [Onboarding & KYC]
      responses: { '200': { description: Consents } }
  /v1/employers:
    post:
      summary: Register employer (RC number, contacts, remittance terms)
      tags: [Contributions & Employers]
      responses: { '201': { description: Registered } }
  /v1/employers/{id}/schedules:
    post:
      summary: Upload contribution schedule (CSV/XLSX or JSON) with PIN validation
      tags: [Contributions & Employers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '201': { description: Validated }, '422': { description: Validation errors } }
  /v1/contributions:
    post:
      summary: Post approved schedule to member accounts (cash P1; units P2)
      tags: [Contributions & Employers]
      responses: { '200': { description: Posted } }
  /v1/contributions/upload:
    post:
      summary: Upload employer contribution schedule CSV (parse -> recon -> ledger post)
      tags: [Contributions & Employers]
      parameters:
        - { name: employer, in: query, schema: { type: string } }
        - { name: period, in: query, schema: { type: string } }
      responses: { '201': { description: Reconciled and posted }, '422': { description: Schedule invalid } }
  /v1/recon/exceptions:
    get:
      summary: List unmatched remittances/suspense items with aging
      tags: [Reconciliation]
      responses: { '200': { description: Exceptions } }
  /v1/recon/exceptions/{id}/resolve:
    post:
      summary: Resolve exception (auto-match, reclassify, refund) — maker-checker
      tags: [Reconciliation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Actor, in: header, required: true, schema: { type: string } }
      responses: { '200': { description: Resolved }, '404': { description: Not found }, '409': { description: Already resolved } }
  /v1/members/{id}/contributions:
    get:
      summary: Member contribution history
      tags: [Contributions & Employers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: History } }
  /v1/members/{id}/alive:
    post:
      summary: '"I Am Alive" liveness check from the member PWA (KYC liveness engine, IAM_ALIVE kind; consent required; retry cap 3/24h)'
      tags: [Benefits & Transfers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{status: VERIFIED, next_due}' }
        '202': { description: '{status: MANUAL_REVIEW}' }
        '400': { description: Consent required / bad request }
        '422': { description: '{status: FAILED, retries_left}' }
        '429': { description: Retry cap exceeded }
    get:
      summary: Member liveness status (last verified at, next due)
      tags: [Benefits & Transfers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{last_verified_at, next_due, status}' }
        '404': { description: Unknown member or never verified }
  /v1/members/{id}/locale:
    put:
      summary: Set member preferred locale (en, yo, ha, ig, pcm-NG) for app and channel replies
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{member_id, locale}' }
        '400': { description: Unsupported locale }
    get:
      summary: Get member preferred locale (defaults to en)
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{member_id, locale}' }
        '404': { description: Unknown member }
  /v1/members/{id}/balance:
    get:
      summary: Member RSA balance from the ledger (integer kobo)
      tags: [Contributions & Employers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Balance }, '404': { description: Unknown member } }
  /v1/members/{id}/statement:
    get:
      summary: On-demand statement payload with HMAC verification code (<5s)
      tags: [Statements & Reporting]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, schema: { type: string } }
      responses: { '200': { description: Statement payload + verify_code }, '404': { description: Unknown member } }
  /v1/members/{id}/statement.pdf:
    get:
      summary: On-demand QR-verifiable statement PDF (<5s)
      tags: [Statements & Reporting]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: PDF, content: { application/pdf: {} } } }
  /v1/statements/verify:
    post:
      summary: Verify a statement HMAC code (QR round-trip)
      tags: [Statements & Reporting]
      responses: { '200': { description: '{valid: bool}' } }
  /v1/statements/schedules:
    post:
      summary: Recurring e-delivery schedules (quarterly default)
      tags: [Statements & Reporting]
      responses: { '201': { description: Scheduled } }
  /v1/reports/{return_code}:
    get:
      summary: Generate statutory return (quarterly/annual packs)
      tags: [Statements & Reporting]
      parameters:
        - { name: return_code, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Return draft } }
  /v1/onboarding:
    post:
      summary: Open a unified onboarding case (FR-520) for a person-facing stakeholder (MEMBER, MICRO_MEMBER, RETIREE, NOK)
      tags: [Onboarding & KYC]
      responses: { '201': { description: Case created (DRAFT) }, '400': { description: Unknown stakeholder / missing fields } }
  /v1/onboarding/{id}:
    get:
      summary: Onboarding case status, steps and linked entity (FR-520)
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Case }, '404': { description: Unknown case } }
  /v1/onboarding/{id}/steps/{step}:
    post:
      summary: Complete a pipeline step in order (KYC steps run via the KYC facade; auto-approve pipelines reach ACTIVE)
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: step, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Step completed; case returned }
        '400': { description: Unknown step / missing evidence }
        '409': { description: Out-of-order, already done, or terminal case }
        '422': { description: KYC/liveness check failed }
  /v1/onboarding/{id}/approve:
    post:
      summary: Approve an APPROVAL_PENDING case (staff-only, maker-checker via X-Actor)
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Actor, in: header, required: true, schema: { type: string } }
      responses: { '200': { description: ACTIVE }, '403': { description: Maker-checker violation }, '409': { description: Not pending approval } }
  /v1/onboarding/{id}/reject:
    post:
      summary: Reject a case with a mandatory reason (staff-only, maker-checker via X-Actor)
      tags: [Onboarding & KYC]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Actor, in: header, required: true, schema: { type: string } }
      responses: { '200': { description: REJECTED }, '403': { description: Maker-checker violation }, '409': { description: Terminal case } }
  /v1/audit/export:
    get:
      summary: Export hash-chained audit slice with integrity check (staff-only, dual control)
      tags: [Statements & Reporting]
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: X-Approver-1, in: header, required: true, schema: { type: string } }
        - { name: X-Approver-2, in: header, required: true, schema: { type: string } }
      responses: { '200': { description: Export }, '403': { description: Dual control required } }
  /v1/claims:
    post:
      summary: Benefit application (lump sum, programmed withdrawal, annuity handoff, invalidity, death)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Submitted } }
  /v1/claims/{id}/decision:
    post:
      summary: Approval/rejection with maker-checker
      tags: [Benefits & Transfers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Decided } }
  /v1/transfers:
    post:
      summary: Initiate RSA transfer (one per 365 days; PenCom RTS sync)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Initiated }, '422': { description: 365-day rule } }
  /v1/funds/{id}/nav:
    get:
      summary: Query daily NAV per fund
      tags: [Funds]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: NAV } }
    post:
      summary: Publish daily NAV per fund
      tags: [Funds]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Published } }
  /v1/retirees/liveness:
    post:
      summary: '"I Am Alive" annual verification (reuses KYC liveness engine, IAM_ALIVE kind)'
      tags: [Benefits & Transfers]
      responses: { '200': { description: Verified } }
  /v1/webhooks:
    post:
      summary: Register signed webhook endpoint (kyc.verified, contribution.posted, claim.decided, transfer.state.changed)
      tags: [Partner APIs]
      responses: { '201': { description: Registered } }
  /v1/mpg/floor:
    get:
      summary: Current Minimum Pension Guarantee floor (₦52,500, PRA s.84) with actuarial-review metadata
      tags: [Benefits & Transfers]
      responses: { '200': { description: MPG floor + review schedule } }
  /v1/mpg/assessments:
    post:
      summary: Run MPG top-up assessment over a retiree payroll batch (PPF-funded top-ups; state gating)
      tags: [Benefits & Transfers]
      responses: { '200': { description: Assessments + total top-up } }
    get:
      summary: List MPG assessments for a payroll period
      tags: [Benefits & Transfers]
      parameters:
        - { name: period, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Assessments } }
  /v1/ppf/contributions:
    post:
      summary: Record a Pension Protection Fund contribution (FG | INDUSTRY | STATE | EMPLOYER; WORM ledger)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Recorded } }
    get:
      summary: PPF ledger with per-source aggregates
      tags: [Benefits & Transfers]
      responses: { '200': { description: Contributions + aggregates } }
  /v1/pencare/fund:
    get:
      summary: PenCare fund headline — MPG floor, active enrollees/cards, per-source aggregates
      tags: [Benefits & Transfers]
      responses: { '200': { description: Fund headline } }
  /v1/pencare/fund/contributions:
    post:
      summary: Record a PenCare fund contribution (INDUSTRY | PFA | PENCOM | DONOR; WORM ledger)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Recorded } }
    get:
      summary: PenCare fund ledger
      tags: [Benefits & Transfers]
      responses: { '200': { description: Contributions } }
  /v1/pencare/enrollees:
    post:
      summary: Enrol a low-income retiree in PenCare (pension below MPG floor)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Enrolled }, '422': { description: Not low-income } }
    get:
      summary: List PenCare enrollees
      tags: [Benefits & Transfers]
      responses: { '200': { description: Enrollees } }
  /v1/pencare/cards:
    post:
      summary: Request a PenCare health access card (optionally issue+activate with card_number)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Requested/issued }, '422': { description: Rejected } }
    get:
      summary: List PenCare cards (optional enrollee_id filter)
      tags: [Benefits & Transfers]
      parameters:
        - { name: enrollee_id, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Cards } }
  /v1/pencare/premiums:
    post:
      summary: Record an insurer premium payment for an enrollee (WORM)
      tags: [Benefits & Transfers]
      responses: { '201': { description: Recorded }, '422': { description: Rejected } }
    get:
      summary: List PenCare premium payments (optional enrollee_id filter)
      tags: [Benefits & Transfers]
      parameters:
        - { name: enrollee_id, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Premiums } }
  /v1/investment/mandates:
    post:
      summary: Register an infrastructure-investment mandate (e.g. FSD Africa platform; USD/NGN)
      tags: [Investments]
      responses: { '201': { description: Created }, '422': { description: Rejected } }
    get:
      summary: List investment mandates
      tags: [Investments]
      responses: { '200': { description: Mandates } }
  /v1/investment/config:
    post:
      summary: Set RSA-fund AUM (kobo) and/or FX rate (kobo per USD) for exposure cap checks
      tags: [Investments]
      responses: { '200': { description: Updated } }
  /v1/investment/commitments:
    post:
      summary: Record a fund commitment — gated on mandate open, target headroom, per-fund cap (WORM)
      tags: [Investments]
      responses: { '201': { description: Recorded }, '422': { description: Cap/target/closed rejection } }
    get:
      summary: List commitments (optional mandate_id filter)
      tags: [Investments]
      parameters:
        - { name: mandate_id, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Commitments } }
  /v1/investment/deployments:
    post:
      summary: Deploy committed capital into a vehicle/SPV (never exceeds commitments; WORM)
      tags: [Investments]
      responses: { '201': { description: Recorded }, '422': { description: Over-deployment rejection } }
    get:
      summary: List deployments (optional mandate_id filter)
      tags: [Investments]
      parameters:
        - { name: mandate_id, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Deployments } }
  /v1/investment/exposure:
    get:
      summary: Mandate exposure report — target, committed, deployed, headroom, undrawn, fill %
      tags: [Investments]
      parameters:
        - { name: mandate_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Exposure }, '404': { description: Mandate not found } }
  /v1/advisory/project:
    post:
      summary: Retirement adequacy projection — projected balance, expected pension, gap, recommended extra contribution
      tags: [Innovation]
      responses: { '200': { description: Projection } }
  /v1/escalation/rules:
    post:
      summary: Enrol member in contribution auto-escalation
      tags: [Innovation]
      responses: { '201': { description: Enrolled } }
    get:
      summary: List escalation rules
      tags: [Innovation]
      responses: { '200': { description: Rules } }
  /v1/escalation/tick:
    post:
      summary: Apply annual escalation step-ups (audited events)
      tags: [Innovation]
      responses: { '200': { description: Step-up events } }
  /v1/escalation/optout:
    post:
      summary: Opt a member out of escalation (reason required, audited)
      tags: [Innovation]
      responses: { '200': { description: Opted out } }
  /v1/roundup/wallets:
    post:
      summary: Open a round-up AVC wallet (step + monthly cap)
      tags: [Innovation]
      responses: { '201': { description: Wallet } }
    get:
      summary: Get wallet + sweep history (member_id)
      tags: [Innovation]
      parameters:
        - { name: member_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Wallet } }
  /v1/roundup/sweeps:
    post:
      summary: Book a round-up sweep for a transaction
      tags: [Innovation]
      responses: { '201': { description: Sweep } }
  /v1/glidepath/members:
    post:
      summary: Register member into PenCom multi-fund lifecycle (Fund I-IV by age/election)
      tags: [Innovation]
      responses: { '201': { description: Assignment } }
    get:
      summary: Get member fund assignment + switch history (member_id)
      tags: [Innovation]
      parameters:
        - { name: member_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Member + switches } }
  /v1/glidepath/birthday:
    post:
      summary: Advance member age; auto-switch fund on band crossing
      tags: [Innovation]
      responses: { '200': { description: Switch or null } }
  /v1/glidepath/elect:
    post:
      summary: Elect a fund (age/status rules enforced, e.g. Fund I <50 only)
      tags: [Innovation]
      responses: { '200': { description: Switch } }
  /v1/literacy/catalogue:
    get:
      summary: Localized financial-literacy lessons (lang=en|pcm|ha|yo|ig, topic filter)
      tags: [Innovation]
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string } }
        - { name: topic, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Lessons } }
  /v1/literacy/answer:
    post:
      summary: Submit a quiz answer; records member progress
      tags: [Innovation]
      responses: { '200': { description: Progress } }
  /v1/literacy/score:
    get:
      summary: Member literacy score (member_id)
      tags: [Innovation]
      parameters:
        - { name: member_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Score } }
  /v1/mortgage/applications:
    post:
      summary: Apply for 25% RSA residential-mortgage equity contribution (PRA s.89(2))
      tags: [Innovation]
      responses: { '201': { description: Application }, '422': { description: Cap/employment rejection } }
    get:
      summary: List mortgage applications (optional member_id)
      tags: [Innovation]
      parameters:
        - { name: member_id, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Applications } }
  /v1/mortgage/decisions:
    post:
      summary: Approve/reject/disburse a mortgage application
      tags: [Innovation]
      responses: { '200': { description: Application } }
  /v1/claimsfast/packs:
    post:
      summary: Open a 48-hour straight-through benefit claim pack
      tags: [Innovation]
      responses: { '201': { description: Pack } }
    get:
      summary: Get claim pack readiness (rsa_id)
      tags: [Innovation]
      parameters:
        - { name: rsa_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Pack } }
  /v1/claimsfast/complete:
    post:
      summary: Mark a pack item complete; re-scores STP eligibility
      tags: [Innovation]
      responses: { '200': { description: Pack } }
  /v1/succession/nominations:
    post:
      summary: Nominate beneficiaries (shares must total 100%; versioned WORM history)
      tags: [Innovation]
      responses: { '201': { description: Nomination } }
    get:
      summary: Current nomination for a member (member_id)
      tags: [Innovation]
      parameters:
        - { name: member_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Nomination } }
  /v1/succession/due:
    get:
      summary: Members due for nomination liveness re-confirmation
      tags: [Innovation]
      responses: { '200': { description: Member IDs } }
  /v1/fraud/screen:
    post:
      summary: Real-time transaction anomaly scoring; opens case at threshold
      tags: [Innovation]
      responses: { '200': { description: Score + signals + optional case } }
  /v1/fraud/cases:
    get:
      summary: Fraud case queue (open=1 for open only)
      tags: [Innovation]
      parameters:
        - { name: open, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Cases } }
  /v1/fraud/resolve:
    post:
      summary: Resolve a case (CONFIRMED_FRAUD | CLEARED)
      tags: [Innovation]
      responses: { '200': { description: Case } }
  /v1/ml/fraud/screen:
    post:
      summary: Fused fraud screening — rules engine + FraudFusion ML (fail-closed to rules)
      tags: [ML]
      responses: { '200': { description: Fused score } }
  /v1/ml/health:
    get:
      summary: ML inference service health + champion model version
      tags: [ML]
      responses: { '200': { description: Health } }
  /v1/readiness/reports:
    post:
      summary: Compute employer workforce retirement-readiness index (0-100 + grade)
      tags: [Innovation]
      responses: { '201': { description: Report } }
    get:
      summary: Employer readiness history (employer_id)
      tags: [Innovation]
      parameters:
        - { name: employer_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Reports } }
  /v1/diaspora/members:
    post:
      summary: Enrol a diaspora member (passport tier)
      tags: [Innovation]
      responses: { '201': { description: Member } }
  /v1/diaspora/rates:
    post:
      summary: Set FCY booking rate (kobo per unit; USD|GBP|EUR)
      tags: [Innovation]
      responses: { '200': { description: Updated } }
  /v1/diaspora/contributions:
    post:
      summary: Book an FCY remittance into the RSA (FX converted to kobo)
      tags: [Innovation]
      responses: { '201': { description: Contribution } }
    get:
      summary: Diaspora contributions + kobo total (rsa_id)
      tags: [Innovation]
      parameters:
        - { name: rsa_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Contributions } }
  /v1/agents:
    post:
      summary: Accredit a pension agent (informal-sector channel)
      tags: [Innovation]
      responses: { '201': { description: Agent } }
  /v1/agents/enrolments:
    post:
      summary: Record an agent-originated micro-pension enrolment
      tags: [Innovation]
      responses: { '201': { description: Enrolment } }
  /v1/agents/commissions:
    post:
      summary: Book an agent commission (WORM ledger)
      tags: [Innovation]
      responses: { '201': { description: Commission } }
  /v1/agents/leaderboard:
    get:
