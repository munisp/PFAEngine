# Debezium CDC add-on for the PFAEngine stack (docs/CDC.md).
# Merge this snippet into deploy/docker-compose.yml (lead owns that file).
# Everything here is additive and profile-gated (`cdc`) so the base stack
# is unchanged when the profile is off.
version: "3.9"

services:
  # --- REQUIRED change to the EXISTING postgres service ---------------
  # pgoutput logical decoding needs wal_level=logical. The postgis image
  # ships wal_level=replica; override with command flags (equivalent to
  # ALTER SYSTEM SET wal_level=logical + restart). Merge this `command`
  # onto the existing `postgres:` service:
  #
  #   postgres:
  #     command:
  #       - postgres
  #       - -c wal_level=logical
  #       - -c max_replication_slots=4
  #       - -c max_wal_senders=4
  #
  # (Alternative: ALTER SYSTEM SET wal_level = 'logical'; + a restart.
  #  See deploy/debezium/README.md.)

  connect:
    # Debezium Connect (Kafka Connect + Postgres source connector).
    image: debezium/connect:2.7
    profiles: ["cdc"]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pfaengine-connect
      CONFIG_STORAGE_TOPIC: pfaengine_connect_configs
      OFFSET_STORAGE_TOPIC: pfaengine_connect_offsets
      STATUS_STORAGE_TOPIC: pfaengine_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Dead-letter queue: a poison event must not stall the connector.
      CONNECT_ERRORS_TOLERANCE: all
      CONNECT_ERRORS_LOG_ENABLE: "true"
      CONNECT_ERRORS_LOG_INCLUDE_MESSAGES: "true"
    depends_on: [kafka, postgres]
    restart: unless-stopped

  cdc-consumer:
    # Kafka -> bronze parquet applier (analytics/cdc_consumer.py).
    # Uses the same image/build as analytics-run; runs continuously.
    build: { context: .., dockerfile: deploy/analytics.Dockerfile }
    profiles: ["cdc"]
    command: ["python3", "cdc_consumer.py",
              "--brokers", "kafka:9092",
              "--lake", "/lake",
              "--migrations", "/app/db/migrations"]
    environment:
      LAKE_DIR: /lake
      CDC_WATERMARK_PATH: /lake/bronze/cdc_watermark.json
    volumes: ["lakedata:/lake"]
    depends_on: [connect]
    restart: unless-stopped

  # analytics-svc: add this env var so /v1/analytics/cdc-status can read
  # the shared watermark file (mount the lake volume read-only):
  #
  #   analytics-svc:
  #     environment:
  #       CDC_WATERMARK_PATH: /lake/bronze/cdc_watermark.json
  #     volumes: ["lakedata:/lake:ro"]
