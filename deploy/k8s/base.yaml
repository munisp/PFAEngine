# Kubernetes base manifests (AR-02: EKS default; RKE2/k3s/OpenShift on-prem).
apiVersion: v1
kind: Namespace
metadata:
  name: pfaengine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pfaengine
spec:
  replicas: 3 # NFR-01: 99.95% for gateway
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/munisp/pfaengine/api-gateway:v1.0.0 # pinned release tag
          ports: [{ containerPort: 8080 }]
          securityContext: # non-root (matches Dockerfile uid 10001)
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
---
# HPA: linear scale-out per service (NFR-03: 1M+ RSAs)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: pfaengine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
