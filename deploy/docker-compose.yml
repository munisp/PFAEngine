# PFAEngine local/production-equivalent stack (AR-01..AR-10, NFR-11).
# No cloud-proprietary managed services — identical on-prem (NFR-11).
version: "3.9"

# Shared healthcheck defaults for app services (image ships wget; every
# service exposes /healthz — see internal/httpsrv and internal/appx).
x-app-healthcheck: &app-healthcheck
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pfaengine
      POSTGRES_DB: pfaengine
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: pfaengine-kraft-cluster-001

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8085:8080"]

  temporal:
    image: temporalio/auto-setup:1.25
    ports: ["7233:7233", "8233:8233"]
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: pfaengine
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on: [postgres]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z # pinned — never :latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pfaengine
      MINIO_ROOT_PASSWORD: pfaengine123
    ports: ["9000:9000", "9001:9001"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
    ports: ["9200:9200"]

  # Wazuh SIEM/FIM (AR-09) — enable in regulated deployments:
  # wazuh-manager:
  #   image: wazuh/wazuh-manager:4.9.0
  #   ports: ["1514:1514", "1515:1515", "514:514/udp", "55000:55000"]

  api-gateway:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    depends_on: [postgres, kafka]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
  identity:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: identity } }
    ports: ["8081:8081"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
  kyc:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: kyc } }
    ports: ["8082:8082"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
  member:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: member } }
    ports: ["8083:8083"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/healthz"]
  contribution:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: contribution } }
    ports: ["8084:8084"]
    depends_on: [postgres, kafka]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/healthz"]
  reconciliation:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: reconciliation } }
    ports: ["8095:8085"]
    depends_on: [postgres, kafka]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/healthz"]
  ledger:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: ledger } }
    ports: ["8086:8086"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/healthz"]
  statement:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: statement } }
    ports: ["8087:8087"]
    depends_on: [postgres, minio]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8087/healthz"]
  reporting:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: reporting } }
    ports: ["8088:8088"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
  notification:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: notification } }
    ports: ["8089:8089"]
    depends_on: [postgres, kafka]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8089/healthz"]
  audit:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: audit } }
    ports: ["8090:8090"]
    depends_on: [postgres, opensearch]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
  employer-portal:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: employer-portal } }
    ports: ["8091:8091"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/healthz"]
  benefit:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: benefit } }
    ports: ["8092:8092"]
    depends_on: [postgres, temporal]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/healthz"]
  transfer:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: transfer } }
    ports: ["8093:8093"]
    depends_on: [postgres, temporal]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8093/healthz"]
  fund-pricing:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: fund-pricing } }
    ports: ["8094:8094"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8094/healthz"]
  member-svc:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: member-svc } }
    ports: ["8096:8096"]
    depends_on: [postgres]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8096/healthz"]

  # ---- Tranche 18: AI/ML stack ----
  ml-serve:
    # FraudFusion CPU inference (champion model from registry)
    build:
      context: ..
      dockerfile: deploy/ml-serve.Dockerfile
    environment:
      ML_REGISTRY_ROOT: /models
    volumes: ["mlmodels:/models"]
    ports: ["8077:8077"]

  mlflow:
    # Model tracking server; MLFLOW_TRACKING_URI=http://mlflow:5050 switches
    # pfa_ml.registry from file-based to MLflow-backed automatically.
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --port 5050 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts
    ports: ["5050:5050"]
    volumes: ["mlflowartifacts:/artifacts"]

  ml-train:
    # Continuous training driver: extract -> train -> evaluate -> promote
    build:
      context: ..
      dockerfile: deploy/ml-serve.Dockerfile
    command: ["python", "-m", "pfa_ml.continuous", "--dsn", "postgres://postgres:pfaengine@postgres:5432/pfaengine", "--tenant", "dev", "--interval", "3600"]
    environment:
      ML_REGISTRY_ROOT: /models
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes: ["mlmodels:/models"]
    depends_on: [postgres, mlflow]

  falkordb:
    # Graph store: fraud rings + pension knowledge graph (KGQA backend)
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]
    volumes: ["falkordata:/data"]

  ollama:
    # Self-hosted LLM for chatbot rephrasing + ops (deterministic intents stay primary)
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]

volumes:
  pgdata:
  mlmodels:
  mlflowartifacts:
  falkordata:
  ollamadata:
